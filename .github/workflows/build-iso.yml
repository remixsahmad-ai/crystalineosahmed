name: Build Crystalline OS ISO (Final)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Loop Devices & Deep Dependencies
        run: |
          sudo modprobe loop
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools mtools librsvg2-bin flatpak-builder git
          for i in {0..7}; do
            if [ ! -e /dev/loop$i ]; then
              sudo mknod -m 0660 /dev/loop$i b 7 $i
            fi
          done

      - name: Setup Build Configuration
        run: |
          mkdir -p iso-build
          cd iso-build
          lb config --architecture amd64 \
                    --distribution bookworm \
                    --archive-areas "main contrib non-free non-free-firmware" \
                    --bootloader grub-efi \
                    --debian-installer false

      - name: Inject Core Tools & Waydroid ARM Support
        run: |
          mkdir -p iso-build/config/package-lists
          cat << 'EOF' > iso-build/config/package-lists/desktop.list.chroot
          kde-plasma-desktop
          pipewire
          network-manager
          flatpak
          python3
          python3-pip
          curl
          git
          wget
          EOF

          # دمج مترجم ARM داخل Waydroid تلقائياً لتطبيقات الأندرويد
          mkdir -p iso-build/config/includes.chroot/usr/local/bin
          cat << 'EOF' > iso-build/config/includes.chroot/usr/local/bin/setup-waydroid-arm
          #!/bin/bash
          waydroid init -s GAPPS -f
          curl -L https://github.com/waydroid/waydroid-extras/releases/latest/download/waydroid_extras_p.tar.gz | tar -xz -C /tmp
          python3 /tmp/waydroid_extras_p/main.py install_libndk
          EOF
          chmod +x iso-build/config/includes.chroot/usr/local/bin/setup-waydroid-arm

      - name: Design & Inject Green X Start Icon (Replaces Windows Icon Completely)
        run: |
          mkdir -p iso-build/config/includes.chroot/usr/share/icons/hicolor/scalable/apps
          cat << 'EOF' > iso-build/config/includes.chroot/usr/share/icons/hicolor/scalable/apps/start-here-kde.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
            <rect width="100" height="100" rx="20" fill="#0f0f13"/>
            <path d="M 25,25 L 75,75 M 75,25 L 25,75" stroke="#00FF66" stroke-width="12" stroke-linecap="round"/>
          </svg>
          EOF

      - name: Inject Gemini Daemon (Hybrid Mode)
        run: |
          mkdir -p iso-build/config/includes.chroot/etc/systemd/system/
          cat << 'EOF' > iso-build/config/includes.chroot/usr/local/bin/gemini-daemon
          #!/usr/bin/env python3
          import time, subprocess, json

          def audit_logs():
              try:
                  res = subprocess.run("journalctl -p 3 -n 5 --no-pager -o json", shell=True, capture_output=True, text=True)
                  return [json.loads(line) for line in res.stdout.strip().split('\n') if line]
              except Exception:
                  return []

          if __name__ == "__main__":
              while True:
                  errs = audit_logs()
                  if errs:
                      print(f"[Gemini Monitor]: Detected {len(errs)} system issue(s). Auto-repair ready.")
                  time.sleep(15)
          EOF
          chmod +x iso-build/config/includes.chroot/usr/local/bin/gemini-daemon
          cat << 'EOF' > iso-build/config/includes.chroot/etc/systemd/system/gemini.service
          [Unit]
          Description=Gemini System Monitor

          [Service]
          ExecStart=/usr/local/bin/gemini-daemon
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Build ISO Image
        run: |
          cd iso-build
          sudo lb build --verbose

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crystalline-OS-Installer-Final
          path: iso-build/*.iso
