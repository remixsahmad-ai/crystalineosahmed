name: Build Crystalline OS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: crystalline-iso-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Debian Live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            ca-certificates \
            curl \
            gnupg \
            coreutils \
            xorriso \
            squashfs-tools \
            mtools \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            file \
            rsync \
            python3-yaml
          lb --version
          debootstrap --version

      - name: Patch live-build Contents index URL
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT="$(dpkg -L live-build | grep -E '/lb_chroot_linux-image$' | head -n 1 || true)"
          if [ -z "$SCRIPT" ] || [ ! -f "$SCRIPT" ]; then
            echo "ERROR: Could not locate live-build's kernel-image helper."
            dpkg -L live-build | grep -Ei 'linux.*image|linux_image' || true
            exit 1
          fi
          echo "Inspecting live-build helper: $SCRIPT"
          grep -n -C 3 'Contents-' "$SCRIPT" || true
          sudo python3 - "$SCRIPT" <<'PYCODE'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          original = source
          # live-build versions construct this URL in slightly different ways.
          # Add the main component directory immediately before Contents-.
          source = re.sub(r'(?<![A-Za-z0-9_-])Contents-', 'main/Contents-', source)
          # Avoid accidental duplicate insertion if the file already has main/.
          source = source.replace('main/main/Contents-', 'main/Contents-')
          if source == original:
              print('ERROR: No Contents- URL was found to patch.')
              raise SystemExit(1)
          path.write_text(source)
          print('Patched live-build helper: Contents index now includes main/.')
          PYCODE
          echo "Verifying patch:"
          grep -n -C 2 'Contents-' "$SCRIPT"
          if ! grep -q 'main/Contents-' "$SCRIPT"; then
            echo "ERROR: Contents URL patch verification failed."
            exit 1
          fi

      - name: Configure Crystalline OS
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p iso
          cd iso

          sudo lb clean --purge || true
          sudo rm -rf config
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --debian-installer false \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-chroot https://deb.debian.org/debian \
            --mirror-binary https://deb.debian.org/debian \
            --security false \
            --keyring-packages debian-archive-keyring \
            --apt-recommends true \
            --bootappend-live "boot=live components username=crystalline hostname=crystalline"

          sudo chown -R "$(id -u):$(id -g)" config

          mkdir -p \
            config/package-lists \
            config/apt \
            config/archives \
            config/hooks/normal \
            config/includes.chroot/etc/skel/.config \
            config/includes.chroot/usr/local/bin \
            config/includes.chroot/usr/local/sbin \
            config/includes.chroot/usr/share/applications \
            config/includes.chroot/usr/share/icons/crystalline

          # Use the current Debian Bookworm security suite explicitly.
          # This avoids live-build generating the obsolete bookworm/updates URL.
          cat > config/archives/crystalline-security.list.chroot <<'EOF'
          deb https://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF
          cat > config/archives/crystalline-security.list.binary <<'EOF'
          deb https://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          # Disable optional Contents indexes; no patching of system live-build scripts.
          cat > config/apt/apt.conf.chroot <<'EOF'
          Acquire::IndexTargets::deb::Contents-deb::DefaultEnabled "false";
          Acquire::IndexTargets::deb::Contents-udeb::DefaultEnabled "false";
          EOF

          cat > config/package-lists/crystalline.list.chroot <<'EOF'
          live-boot
          systemd-sysv
          sudo
          dbus
          kde-plasma-desktop
          sddm
          network-manager
          plasma-nm
          konsole
          dolphin
          kate
          ark
          firefox-esr
          flatpak
          pipewire
          wireplumber
          pavucontrol
          fonts-noto-core
          fonts-noto-ui-core
          fonts-noto-extra
          fonts-noto-color-emoji
          fonts-noto-cjk
          fontconfig
          locales
          desktop-base
          qemu-system-x86
          qemu-utils
          virt-manager
          wine
          wine64
          winetricks
          python3
          python3-requests
          curl
          ca-certificates
          git
          htop
          unzip
          p7zip-full
          coreutils
          lxc
          iptables
          sqlite3
          dbus-user-session
          policykit-1
          wayland-utils
          weston
          EOF

          # Install Waydroid in the target system. Android image initialization
          # is deferred until the user runs the setup utility on first boot.
          cat > config/hooks/normal/0900-install-waydroid.hook.chroot <<'HOOK'
          #!/bin/bash
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y curl ca-certificates

          curl -fsSL https://repo.waydro.id -o /tmp/waydroid-repo-installer
          bash /tmp/waydroid-repo-installer bookworm
          apt-get update
          apt-get install -y waydroid

          command -v waydroid
          rm -f /tmp/waydroid-repo-installer
          apt-get clean
          HOOK
          chmod +x config/hooks/normal/0900-install-waydroid.hook.chroot

          cat > config/includes.chroot/etc/skel/.config/kdeglobals <<'EOF'
          [General]
          ColorScheme=BreezeDark
          Name=Crystalline
          font=Noto Sans Arabic,10,-1,5,50,0,0,0,0,0
          menuFont=Noto Sans Arabic,10,-1,5,50,0,0,0,0,0
          toolBarFont=Noto Sans Arabic,10,-1,5,50,0,0,0,0,0
          widgetStyle=Breeze
          EOF

          cat > config/includes.chroot/etc/skel/.config/kwinrc <<'EOF'
          [Plugins]
          blurEnabled=true
          EOF

          cat > config/includes.chroot/usr/share/icons/crystalline/crystalline-x.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#8cffb0"/>
                <stop offset="1" stop-color="#00a85a"/>
              </linearGradient>
            </defs>
            <rect x="4" y="4" width="120" height="120" rx="26" fill="#20252b" fill-opacity=".94" stroke="#a8ffca" stroke-opacity=".8" stroke-width="2"/>
            <path d="M37 30 L64 53 L91 30 L101 40 L77 64 L101 88 L91 98 L64 75 L37 98 L27 88 L51 64 L27 40 Z" fill="url(#g)"/>
          </svg>
          EOF

          cat > config/includes.chroot/usr/local/bin/crystalline-ai <<'PY'
          #!/usr/bin/python3
          import os
          import sys
          import json
          import urllib.request
          import urllib.error

          def main():
              prompt = " ".join(sys.argv[1:]).strip()
              if not prompt:
                  print("Usage: crystalline-ai 'describe the problem'")
                  print("Set GEMINI_API_KEY or ANTHROPIC_API_KEY first.")
                  return 2

              gemini = os.environ.get("GEMINI_API_KEY")
              claude = os.environ.get("ANTHROPIC_API_KEY")

              if gemini:
                  url = (
                      "https://generativelanguage.googleapis.com/v1beta/"
                      "models/gemini-2.5-flash:generateContent?key=" + gemini
                  )
                  payload = {"contents": [{"parts": [{"text": prompt}]}]}
                  headers = {"Content-Type": "application/json"}
              elif claude:
                  url = "https://api.anthropic.com/v1/messages"
                  payload = {
                      "model": "claude-sonnet-4-20250514",
                      "max_tokens": 1200,
                      "messages": [{"role": "user", "content": prompt}]
                  }
                  headers = {
                      "Content-Type": "application/json",
                      "x-api-key": claude,
                      "anthropic-version": "2023-06-01"
                  }
              else:
                  print("Configure GEMINI_API_KEY or ANTHROPIC_API_KEY.")
                  return 2

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers=headers,
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      result = json.loads(response.read().decode())
                  if gemini:
                      print(result["candidates"][0]["content"]["parts"][0]["text"])
                  else:
                      for item in result.get("content", []):
                          if item.get("type") == "text":
                              print(item["text"])
              except (urllib.error.URLError, KeyError, ValueError) as error:
                  print("AI request failed:", error)
                  return 1
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PY
          chmod +x config/includes.chroot/usr/local/bin/crystalline-ai

          cat > config/includes.chroot/usr/local/sbin/crystalline-android-setup <<'SETUP'
          #!/bin/bash
          set -Eeuo pipefail
          if [ "$(id -u)" -ne 0 ]; then
            echo "Run with sudo: sudo crystalline-android-setup"
            exit 1
          fi
          command -v waydroid >/dev/null 2>&1 || {
            echo "Waydroid is not installed."
            exit 1
          }
          systemctl enable --now waydroid-container
          if [ ! -f /var/lib/waydroid/.crystalline-initialized ]; then
            waydroid init -s GAPPS
            touch /var/lib/waydroid/.crystalline-initialized
          fi
          echo "Android setup finished. Google Play certification may be required."
          SETUP
          chmod +x config/includes.chroot/usr/local/sbin/crystalline-android-setup

          cat > config/includes.chroot/usr/local/bin/crystalline-android <<'ANDROID'
          #!/bin/bash
          set -Eeuo pipefail
          command -v waydroid >/dev/null 2>&1 || {
            echo "Waydroid is not installed."
            exit 1
          }
          systemctl is-active --quiet waydroid-container || {
            echo "Run sudo crystalline-android-setup first."
            exit 1
          }
          waydroid show-full-ui
          ANDROID
          chmod +x config/includes.chroot/usr/local/bin/crystalline-android

          cat > config/includes.chroot/usr/share/applications/crystalline-android-setup.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Crystalline Android Setup
          Comment=Initialize Android and Google Play
          Exec=konsole -e sudo /usr/local/sbin/crystalline-android-setup
          Icon=phone
          Terminal=false
          Categories=System;
          EOF

          cat > config/includes.chroot/usr/share/applications/crystalline-android.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Crystalline Android
          Comment=Launch Android
          Exec=/usr/local/bin/crystalline-android
          Icon=phone
          Terminal=false
          Categories=System;
          EOF

          cat > config/includes.chroot/etc/motd <<'EOF'
          Welcome to Crystalline OS
          Debian Live | KDE Plasma | Dark crystalline desktop
          AI helper: crystalline-ai "describe your problem"
          Android: Crystalline Android Setup
          EOF

          sudo chown -R "$(id -u):$(id -g)" config

      - name: Validate workflow and configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          p = Path(".github/workflows/build-iso.yml")
          yaml.safe_load(p.read_text())
          print("Workflow YAML syntax: OK")
          PY
          test -s iso/config/package-lists/crystalline.list.chroot
          ! grep -R -n 'bookworm/updates' iso/config
          bash -n iso/config/hooks/normal/0900-install-waydroid.hook.chroot
          bash -n iso/config/includes.chroot/usr/local/sbin/crystalline-android-setup
          bash -n iso/config/includes.chroot/usr/local/bin/crystalline-android
          python3 -m py_compile iso/config/includes.chroot/usr/local/bin/crystalline-ai
          echo "Configuration checks passed."

      - name: Build ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          cd iso
          sudo chown -R "$(id -u):$(id -g)" config
          set +e
          sudo lb build 2>&1 | tee ../build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "ERROR: live-build failed with exit code $BUILD_STATUS."
            echo "Last 120 lines of build log:"
            tail -n 120 ../build.log || true
            exit "$BUILD_STATUS"
          fi

          ISO_PATH="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$ISO_PATH" ]; then
            echo "ERROR: Build finished without producing an ISO."
            exit 1
          fi
          sudo cp "$ISO_PATH" ../Crystalline-OS-amd64.iso
          sudo chown "$(id -u):$(id -g)" ../Crystalline-OS-amd64.iso
          file ../Crystalline-OS-amd64.iso
          sha256sum ../Crystalline-OS-amd64.iso | tee ../Crystalline-OS-amd64.iso.sha256

      - name: Upload ISO and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystalline-os-build
          path: |
            Crystalline-OS-amd64.iso
            Crystalline-OS-amd64.iso.sha256
            build.log
          if-no-files-found: warn
          retention-days: 7
