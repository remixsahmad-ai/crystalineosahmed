name: Build Crystalline OS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: crystalline-os-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Debian Live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update signing keyring
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            debian-archive-keyring \
            ca-certificates \
            gnupg
          test -s /usr/share/keyrings/debian-archive-keyring.gpg

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get install -y \
            live-build \
            debootstrap \
            coreutils \
            xorriso \
            squashfs-tools \
            mtools \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            file \
            rsync

          test -x /usr/bin/env
          lb --version
          debootstrap --version

      - name: Configure Crystalline OS
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p iso
          cd iso

          sudo lb clean --purge || true

          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --debian-installer false \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-chroot https://deb.debian.org/debian \
            --mirror-binary https://deb.debian.org/debian \
            --keyring-packages debian-archive-keyring \
            --apt-recommends true \
            --bootappend-live "boot=live components username=crystalline hostname=crystalline"

          # Create all configuration directories with safe permissions.
          sudo install -d \
            config/package-lists \
            config/includes.chroot/etc/skel/.config \
            config/includes.chroot/usr/share/icons/crystalline \
            config/includes.chroot/usr/local/bin

          # Package list: use sudo tee to avoid Permission denied.
          sudo tee config/package-lists/crystalline.list.chroot > /dev/null <<'PACKAGES'
          live-boot
          systemd-sysv
          sudo
          dbus
          kde-plasma-desktop
          sddm
          network-manager
          plasma-nm
          konsole
          dolphin
          kate
          ark
          firefox-esr
          flatpak
          pipewire
          wireplumber
          pavucontrol
          fonts-noto-core
          fonts-noto-ui-core
          fonts-noto-extra
          fonts-noto-color-emoji
          fonts-noto-cjk
          fontconfig
          locales
          desktop-base
          qemu-system-x86
          qemu-utils
          virt-manager
          wine
          wine64
          winetricks
          python3
          python3-requests
          curl
          ca-certificates
          git
          htop
          unzip
          p7zip-full
          coreutils
          PACKAGES

          sudo tee config/includes.chroot/etc/skel/.config/kdeglobals > /dev/null <<'EOF'
          [General]
          ColorScheme=BreezeDark
          Name=Crystalline
          font=Noto Sans Arabic,10,-1,5,50,0,0,0,0,0
          menuFont=Noto Sans Arabic,10,-1,5,50,0,0,0,0,0
          toolBarFont=Noto Sans Arabic,10,-1,5,50,0,0,0,0,0
          widgetStyle=Breeze
          EOF

          sudo tee config/includes.chroot/etc/skel/.config/kwinrc > /dev/null <<'EOF'
          [Plugins]
          blurEnabled=true
          EOF

          sudo tee config/includes.chroot/usr/share/icons/crystalline/crystalline-x.svg > /dev/null <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#8cffb0"/>
                <stop offset="1" stop-color="#00a85a"/>
              </linearGradient>
            </defs>
            <rect x="4" y="4" width="120" height="120" rx="26" fill="#20252b" fill-opacity=".94" stroke="#a8ffca" stroke-opacity=".8" stroke-width="2"/>
            <path d="M37 30 L64 53 L91 30 L101 40 L77 64 L101 88 L91 98 L64 75 L37 98 L27 88 L51 64 L27 40 Z" fill="url(#g)"/>
          </svg>
          EOF

          sudo tee config/includes.chroot/usr/local/bin/crystalline-ai > /dev/null <<'PY'
          #!/usr/bin/python3
          import os
          import sys
          import json
          import urllib.request
          import urllib.error

          def main():
              prompt = " ".join(sys.argv[1:]).strip()
              if not prompt:
                  print("Usage: crystalline-ai 'describe your problem'")
                  print("Set GEMINI_API_KEY or ANTHROPIC_API_KEY first.")
                  return 2

              gemini = os.environ.get("GEMINI_API_KEY")
              claude = os.environ.get("ANTHROPIC_API_KEY")

              if gemini:
                  url = (
                      "https://generativelanguage.googleapis.com/v1beta/"
                      "models/gemini-2.5-flash:generateContent?key=" + gemini
                  )
                  payload = {
                      "contents": [{"parts": [{"text": prompt}]}]
                  }
                  headers = {"Content-Type": "application/json"}
              elif claude:
                  url = "https://api.anthropic.com/v1/messages"
                  payload = {
                      "model": "claude-sonnet-4-20250514",
                      "max_tokens": 1200,
                      "messages": [
                          {"role": "user", "content": prompt}
                      ]
                  }
                  headers = {
                      "Content-Type": "application/json",
                      "x-api-key": claude,
                      "anthropic-version": "2023-06-01"
                  }
              else:
                  print("Configure GEMINI_API_KEY or ANTHROPIC_API_KEY.")
                  return 2

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers=headers,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      result = json.loads(response.read().decode())

                  if gemini:
                      print(result["candidates"][0]["content"]["parts"][0]["text"])
                  else:
                      for item in result.get("content", []):
                          if item.get("type") == "text":
                              print(item["text"])
              except (urllib.error.URLError, KeyError, ValueError) as error:
                  print("AI request failed:", error)
                  return 1

              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PY

          sudo chmod +x config/includes.chroot/usr/local/bin/crystalline-ai

          sudo tee config/includes.chroot/etc/motd > /dev/null <<'EOF'
          Welcome to Crystalline OS
          Debian Live | KDE Plasma | Dark crystalline desktop
          AI helper: crystalline-ai "describe your problem"
          EOF

          # Verify that the critical configuration files exist.
          sudo test -s config/package-lists/crystalline.list.chroot
          sudo test -s config/includes.chroot/usr/local/bin/crystalline-ai
          sudo test -x /usr/bin/env

      - name: Build ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          cd iso

          # Do not clean or reconfigure here: keep the prepared files.
          sudo lb build 2>&1 | tee ../build.log

          ISO_PATH="$(sudo find . -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO_PATH" ]; then
            echo "ERROR: No ISO file was generated."
            exit 1
          fi

          sudo cp "$ISO_PATH" ../Crystalline-OS-amd64.iso
          sudo chown "$(id -u):$(id -g)" ../Crystalline-OS-amd64.iso
          file ../Crystalline-OS-amd64.iso

      - name: Upload ISO and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystalline-os-build
          path: |
            Crystalline-OS-amd64.iso
            build.log
          if-no-files-found: warn
          retention-days: 7
